<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' cdn.jsdelivr.net; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests;">
    <title>重置密码 · 飞行雪绒</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="dist/css/main.min.css">
    <link rel="stylesheet" href="css/edge-compat.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .reset-card { width: min(420px, 100%); padding: 28px; border-radius: 20px; border: 1px solid rgba(255,107,157,0.25); background: rgba(255,255,255,0.06); }
        .reset-card h1 { font-size: 1.25rem; margin: 0 0 8px; }
        .reset-card p { color: rgba(250,248,255,0.65); font-size: 0.9rem; margin: 0 0 20px; }
        .reset-msg { margin-top: 12px; font-size: 0.85rem; }
        .reset-msg.error { color: #ff8a9a; }
        .reset-msg.ok { color: #7FD99E; }
    </style>
</head>
<body>
    <div class="reset-card glass">
        <h1>设置新密码</h1>
        <p>通过邮件链接进入此页。请输入新密码（至少 6 位）。</p>
        <label class="account-field">
            <span>新密码</span>
            <input type="password" class="form-input" id="new-password" maxlength="64" autocomplete="new-password">
        </label>
        <label class="account-field">
            <span>确认密码</span>
            <input type="password" class="form-input" id="new-password2" maxlength="64" autocomplete="new-password">
        </label>
        <button type="button" class="btn-primary account-submit btn-block" id="reset-submit">更新密码</button>
        <p class="reset-msg" id="reset-msg"></p>
        <p class="u-mt-4 u-text-center"><a href="index.html" class="link-blue-light">返回首页</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dist/js/supabase-adapter.js"></script>
    <script src="js/reset-password.js"></script>
    <script type="text/plain" data-legacy-inline>
    (function() {
        var msg = document.getElementById('reset-msg');
        var cfg = window.SupabaseAdapter && SupabaseAdapter.config;
        if (!cfg || !cfg.url || cfg.url.indexOf('__SUPABASE') >= 0) {
            msg.textContent = 'Supabase 未配置，请联系站点维护者';
            msg.className = 'reset-msg error';
            return;
        }
        var client = supabase.createClient(cfg.url, cfg.anonKey);
        client.auth.getSession().then(function(res) {
            if (!res.data.session) {
                msg.textContent = '链接无效或已过期，请重新申请重置邮件';
                msg.className = 'reset-msg error';
            }
        });
        document.getElementById('reset-submit').addEventListener('click', function() {
            var p1 = document.getElementById('new-password').value;
            var p2 = document.getElementById('new-password2').value;
            if (p1.length < 6) {
                msg.textContent = '密码至少 6 位';
                msg.className = 'reset-msg error';
                return;
            }
            if (p1 !== p2) {
                msg.textContent = '两次密码不一致';
                msg.className = 'reset-msg error';
                return;
            }
            client.auth.updateUser({ password: p1 }).then(function(result) {
                if (result.error) {
                    msg.textContent = result.error.message;
                    msg.className = 'reset-msg error';
                    return;
                }
                msg.textContent = '密码已更新，3 秒后跳转首页…';
                msg.className = 'reset-msg ok';
                setTimeout(function() { location.href = 'index.html'; }, 3000);
            });
        });
    })();
    </script>
</body>
</html>
