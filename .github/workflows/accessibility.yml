name: Accessibility Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  axe:
    name: axe-core a11y scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 || true
          npx browser-driver-manager install chrome
      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli@4.10.x
      - name: Start static server
        run: |
          npx --yes serve -l 8848 . &
          sleep 3
      - name: Scan main site
        run: |
          axe http://127.0.0.1:8848/ \
            --tags wcag2a,wcag2aa,wcag21aa \
            --exit \
            --timeout 60000 \
            --save axe-report-main.json
      - name: Scan forum
        run: |
          axe http://127.0.0.1:8848/forum/ \
            --tags wcag2a,wcag2aa,wcag21aa \
            --exit \
            --timeout 60000 \
            --save axe-report-forum.json
      - name: Upload axe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-a11y-reports
          path: axe-report-*.json
