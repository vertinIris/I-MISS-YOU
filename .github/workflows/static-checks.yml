name: Static Checks

# 门禁分层：
#   1) smoke-check + extreme-audit（始终跑）：文件存在性 + 版本一致性 + 本地引用存在性
#   2) runtime-assert（始终跑）：无头 Chrome 真实执行页面 JS 后断言 DOM，
#      能抓到「JS 跑起来才暴露」的缺陷（如社区投稿卡被 DOMPurify 剥离、后台入口不可达）
#   3) dist-sync（始终跑）：CI 内重建 dist，若与已提交产物不一致则失败，
#      拦住「改了 js/ 却忘跑 build」的回归
# 可选浏览器探针（Playwright）：仓库 Settings → Variables 设 PLAYWRIGHT_PROBE = 1 启用
#
# 本地等价：
#   node scripts/smoke-check.mjs && node scripts/extreme-audit.mjs
#   node scripts/runtime-assert.mjs
#   node scripts/build-phase2.mjs && git diff --exit-code -- ':!dist/build-report-phase2.json'

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-and-audit:
    name: smoke-check + extreme-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke check
        run: node scripts/smoke-check.mjs
      - name: Extreme audit
        run: node scripts/extreme-audit.mjs

  runtime-assert:
    name: runtime-assert (headless DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Runtime DOM assertions
        run: node scripts/runtime-assert.mjs
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  dist-sync:
    name: dist 构建产物同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 用 npm install 而非 npm ci：仓库 package-lock 与 package.json 存在历史不一致
      # （如 lock 缺 react），npm ci 会严格报错；npm install 对漂移更宽容，CI 容器内为一次性环境不影响提交
      - name: Install build deps
        run: npm install --no-audit --no-fund
      - name: Rebuild dist
        run: node scripts/build-phase2.mjs
      # 诊断：即便门禁失败也先打印差异概览，便于定位（构建产物与已提交版本的差异来源）
      - name: Show diff overview (diagnostic)
        if: always()
        run: git diff --stat -- ':!dist/build-report-phase2.json' ':!dist/**/*.map' || true
      - name: Verify dist is in sync with source
        run: |
          # 排除：build-report（含时间戳）与 *.map（source map 的 mappings 对源码行尾 CRLF/LF 敏感，
          # 跨 Windows/Linux 环境必然不同，且不影响运行，不纳入同步比对）
          git diff --exit-code -- ':!dist/build-report-phase2.json' ':!dist/**/*.map'

  # Optional job — skipped unless PLAYWRIGHT_PROBE=1 (does not block default checks)
  browser-probe:
    name: browser-probe (optional)
    runs-on: ubuntu-latest
    if: ${{ vars.PLAYWRIGHT_PROBE == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Start static server and probe
        run: |
          npx --yes serve -l 8848 . &
          sleep 3
          node scripts/browser-probe.mjs http://127.0.0.1:8848
