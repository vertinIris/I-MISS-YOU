name: Static Checks

# 默认门禁：smoke-check + extreme-audit（始终跑，勿改成依赖 Playwright）。
# 可选浏览器探针：仓库 Settings → Secrets and variables → Actions → Variables
#   新建 PLAYWRIGHT_PROBE = 1 后启用下方 browser-probe job；删变量或改非 1 即跳过。
# 本地等价：
#   node scripts/smoke-check.mjs && node scripts/extreme-audit.mjs
#   npx serve -l 8848 . &  node scripts/browser-probe.mjs http://127.0.0.1:8848

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-and-audit:
    name: smoke-check + extreme-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke check
        run: node scripts/smoke-check.mjs
      - name: Extreme audit
        run: node scripts/extreme-audit.mjs

  # Optional job — skipped unless PLAYWRIGHT_PROBE=1 (does not block default smoke)
  browser-probe:
    name: browser-probe (optional)
    runs-on: ubuntu-latest
    if: ${{ vars.PLAYWRIGHT_PROBE == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chromium
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Start static server and probe
        run: |
          npx --yes serve -l 8848 . &
          sleep 3
          node scripts/browser-probe.mjs http://127.0.0.1:8848
