name: Static Checks

# 门禁分层：
#   1) smoke-check + extreme-audit（始终跑）：文件存在性 + 版本一致性 + 本地引用存在性
#   2) runtime-assert（始终跑）：无头 Chrome 真实执行页面 JS 后断言 DOM，
#      能抓到「JS 跑起来才暴露」的缺陷（如社区投稿卡被 DOMPurify 剥离、后台入口不可达）
#   3) dist-sync（始终跑）：CI 内重建 dist，若与已提交产物不一致则失败，
#      拦住「改了 js/ 却忘跑 build」的回归
# 可选浏览器探针（Playwright）：仓库 Settings → Variables 设 PLAYWRIGHT_PROBE = 1 启用
#
# 本地等价：
#   node scripts/smoke-check.mjs && node scripts/extreme-audit.mjs
#   node scripts/runtime-assert.mjs
#   node scripts/build-phase2.mjs && git diff --exit-code -- ':!dist/build-report-phase2.json'

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-and-audit:
    name: smoke-check + extreme-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke check
        run: node scripts/smoke-check.mjs
      - name: Extreme audit
        run: node scripts/extreme-audit.mjs

  runtime-assert:
    name: runtime-assert (headless DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Runtime DOM assertions
        run: node scripts/runtime-assert.mjs
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  dist-sync:
    name: dist 构建产物同步
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 用 npm install 而非 npm ci：仓库 package-lock 与 package.json 存在历史不一致
      # （如 lock 缺 react / peer 冲突），npm ci 会严格报错；npm install 对漂移更宽容，
      # CI 容器内为一次性环境，不影响提交物。注意：npm install 可能按 lockfile 重写
      # package-lock.json，因此门禁不比对它。
      - name: Install build deps
        run: npm install --no-audit --no-fund
      - name: Rebuild dist
        run: node scripts/build-phase2.mjs
      # 诊断（临时回传）：把 CI 工作树实际变更（git status）与限定范围 diff 贴到 Issue，便于定位根因
      - name: Diff diagnostic (temporary, posts to issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "=== git status --short ==="
            git status --short
            echo "=== scoped diff --stat ==="
            git diff --stat -- 'dist' 'index.html' 'forum/index.html' ':!dist/build-report-phase2.json' ':!dist/**/*.map'
            echo "=== ci-dist-diff ==="
            node scripts/ci-dist-diff.mjs || true
          } | tee /tmp/diag.txt
          gh issue create --title "dist-sync diag [$(git rev-parse --short HEAD)]" --body "$(cat /tmp/diag.txt)" || true
      - name: Verify dist is in sync with source
        run: |
          git diff --exit-code -- 'dist' 'index.html' 'forum/index.html' \
            ':!dist/build-report-phase2.json' ':!dist/**/*.map'

  # Optional job — skipped unless PLAYWRIGHT_PROBE=1 (does not block default checks)
  browser-probe:
    name: browser-probe (optional)
    runs-on: ubuntu-latest
    if: ${{ vars.PLAYWRIGHT_PROBE == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Start static server and probe
        run: |
          npx --yes serve -l 8848 . &
          sleep 3
          node scripts/browser-probe.mjs http://127.0.0.1:8848
